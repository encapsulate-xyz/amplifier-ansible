---
- name: Set up ampd
  hosts: all
  become: true
  gather_facts: true
  vars:
    allowed_node_types: [ampd]
  vars_files:
    - group_vars/all.yml
    - group_vars/vault.yml
    - group_vars/{{ env }}.yml
  pre_tasks:
    - name: Include environment setup tasks
      when: type in allowed_node_types
      ansible.builtin.include_tasks: tasks/setup_environment.yml
  tasks:
    - name: Setup environment and run ampd role
      when: type in allowed_node_types
      block:
        - name: Include common handlers
          ansible.builtin.include_role:
            name: common
        - name: Include ampd role
          ansible.builtin.include_role:
            name: ampd
            public: true
  post_tasks:
    - name: Verify ampd
      when: type in allowed_node_types
      block:
        - name: Include verify service task
          ansible.builtin.include_tasks: tasks/verify_service.yml
          vars:
            log_file_path: "{{ ampd_log_file_path }}"
            version_command: "{{ ampd_bin_dir }}/{{ service_identifier }} --version"
            expected_version: "{{ amplifier.ampd.version | regex_replace('^v', '') }}"
            health_url: "http://localhost:{{ amplifier.ampd.ports.monitoring_server_bind_addr }}/status"
