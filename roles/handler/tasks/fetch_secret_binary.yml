---
- name: Create a tmp directory
  ansible.builtin.file:
    path: "{{ tmp_dir }}/{{ service_identifier }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Download and unarchive the binary
  ansible.builtin.unarchive:
    src: "{{ vault.external.handler.private_source_url }}/{{ type }}/{{ amplifier[type].private_release }}/{{ handler_private_release_name }}.zip"
    dest: "{{ tmp_dir }}/{{ service_identifier }}"
    remote_src: true
    owner: root
    group: root
    mode: "0755"

- name: Copy the binary file
  ansible.builtin.copy:
    src: "{{ tmp_dir }}/{{ service_identifier }}/{{ handler_private_release_name }}"
    dest: "{{ handler_bin_dir }}/{{ service_identifier }}"
    remote_src: true
    force: true
    owner: root
    group: root
    mode: "0755"
  notify:
    - Restart service

- name: Clean up the temporary files in /tmp
  ansible.builtin.file:
    path: "{{ tmp_dir }}/{{ service_identifier }}"
    state: absent
